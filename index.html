<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atlas Centrów Integracji</title>
<link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--ink:#17231f;--muted:#66736d;--paper:#f4f2ea;--card:#fff;--line:#d9ddd7;--accent:#1f6a55;--accent2:#d8e8df;--shadow:0 14px 35px rgba(20,35,30,.10)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(244,242,234,.94)}.brand{font-family:Georgia,serif;font-size:24px}.brand small{font:500 11px Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;margin-top:2px}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 15px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.layout{display:grid;grid-template-columns:370px 1fr;height:calc(100vh - 72px)}.sidebar{padding:22px;overflow:auto;border-right:1px solid var(--line)}h1{font-family:Georgia,serif;font-size:35px;line-height:1.02;margin:0 0 9px;font-weight:500}.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.filters input{grid-column:1/-1}.field{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:white}.count{font-size:12px;color:var(--muted);margin:10px 0}.cards{display:flex;flex-direction:column;gap:9px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.card .city{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}.card h3{margin:5px 0;font-family:Georgia,serif;font-size:20px;font-weight:500}.card p{margin:0;color:var(--muted);font-size:12px}.mapwrap{position:relative}#map{height:100%;width:100%;background:#dfe5df}.legend{position:absolute;z-index:500;right:18px;bottom:18px;background:white;padding:11px 13px;border-radius:12px;box-shadow:var(--shadow);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:6px}.drawer,.modal{position:fixed;z-index:1000;background:white;box-shadow:var(--shadow)}.drawer{right:20px;top:92px;width:min(440px,calc(100vw - 40px));max-height:calc(100vh - 112px);overflow:auto;border-radius:16px;padding:22px;display:none}.drawer.open{display:block}.close{float:right;border:0;background:#eef1ee;border-radius:50%;width:32px;height:32px;cursor:pointer}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--accent)}.drawer h2{font-family:Georgia,serif;font-size:30px;font-weight:500;margin:7px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.meta div{background:#f5f6f3;border-radius:10px;padding:10px}.meta b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.description{line-height:1.55;color:#3f4b46}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:var(--accent2);padding:5px 8px;border-radius:999px;font-size:11px}.modal{inset:0;background:rgba(15,24,20,.38);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.formbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:18px;padding:24px}.formbox h2{font-family:Georgia,serif;font-size:30px;font-weight:500;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.grid .full{grid-column:1/-1}label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}textarea.field{min-height:95px;resize:vertical}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.leaflet-popup-content-wrapper{border-radius:12px}.popup-title{font-family:Georgia,serif;font-size:17px;margin-bottom:3px}@media(max-width:780px){.layout{grid-template-columns:1fr;grid-template-rows:42vh 58vh}.sidebar{order:2;border-right:0}.mapwrap{order:1}.top{padding:0 14px}.brand{font-size:19px}.actions .secondary{display:none}.drawer{top:82px;right:10px;width:calc(100vw - 20px)}.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}}
</style></head><body>
<header class="top"><div class="brand">Atlas Centrów Integracji<small>Polska i Europa · baza badawcza</small></div><div class="actions"><button class="btn secondary" id="exportBtn">Eksportuj JSON</button><button class="btn primary" id="addBtn">+ Dodaj centrum</button></div></header>
<main class="layout"><aside class="sidebar"><h1>Przestrzenie integracji na mapie Europy</h1><p class="lead">Interaktywna baza centrów integracji cudzoziemców i przestrzeni międzykulturowych. Kliknij pinezkę lub obiekt na liście.</p><div class="filters"><input id="search" class="field" placeholder="Szukaj nazwy lub miasta…"><select id="country" class="field"><option value="">Wszystkie kraje</option></select><select id="type" class="field"><option value="">Wszystkie typy</option><option>CIC</option><option>Centrum międzykulturowe</option><option>Community centre</option><option>Inne</option></select></div><div class="count" id="count"></div><div class="cards" id="cards"></div></aside><section class="mapwrap"><div id="map"></div><div class="legend"><span class="dot"></span> centrum w bazie</div></section></main>
<section class="drawer" id="drawer"><button class="close" id="drawerClose">×</button><div id="detail"></div></section>
<section class="modal" id="modal"><form class="formbox" id="form"><button type="button" class="close" id="modalClose">×</button><h2>Dodaj centrum</h2><input type="hidden" id="editId"><div class="grid">
<div><label>Nazwa *</label><input class="field" id="name" required></div><div><label>Typ</label><select class="field" id="fType"><option>CIC</option><option>Centrum międzykulturowe</option><option>Community centre</option><option>Inne</option></select></div>
<div><label>Miasto *</label><input class="field" id="city" required></div><div><label>Kraj *</label><input class="field" id="fCountry" required></div>
<div><label>Szerokość geograficzna *</label><input class="field" id="lat" type="number" step="any" required></div><div><label>Długość geograficzna *</label><input class="field" id="lng" type="number" step="any" required></div>
<div><label>Adres</label><input class="field" id="address"></div><div><label>Rok otwarcia</label><input class="field" id="year" type="number"></div>
<div><label>Powierzchnia [m²]</label><input class="field" id="area" type="number"></div><div><label>Operator / zarządzanie</label><input class="field" id="operator"></div>
<div class="full"><label>Funkcje — oddziel przecinkami</label><input class="field" id="functions" placeholder="warsztaty, kuchnia, coworking…"></div>
<div class="full"><label>Opis</label><textarea class="field" id="description"></textarea></div>
<div><label>WAPI</label><input class="field" id="wapi" type="number" min="0" max="100"></div><div><label>Źródło / strona WWW</label><input class="field" id="source" type="url" placeholder="https://…"></div>
</div><div class="formactions"><button type="button" class="btn" id="cancel">Anuluj</button><button class="btn primary" type="submit">Zapisz centrum</button></div></form></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const seed=[
{id:'baobab',name:'Baobab',city:'Lublin',country:'Polska',type:'Centrum międzykulturowe',lat:51.2465,lng:22.5684,address:'Lublin',year:2022,area:'',operator:'',functions:['warsztaty','spotkania','integracja'],description:'Przykładowy rekord startowy. Uzupełnij zweryfikowane dane w panelu edycji.',wapi:'',source:''},
{id:'salus',name:'Salus Space',city:'Bolonia',country:'Włochy',type:'Community centre',lat:44.4808,lng:11.3915,address:'Bolonia',year:'',area:'',operator:'',functions:['mieszkalnictwo','działania społeczne','przestrzeń wspólna'],description:'Przykładowy rekord startowy do dalszego uzupełnienia na podstawie źródeł.',wapi:'',source:''}
];
let data=JSON.parse(localStorage.getItem('integration-centres-atlas')||'null')||seed;
const map=L.map('map',{zoomControl:true}).setView([51.3,15.5],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let layer=L.layerGroup().addTo(map);
const $=id=>document.getElementById(id);function save(){localStorage.setItem('integration-centres-atlas',JSON.stringify(data))}
function filtered(){let q=$('search').value.toLowerCase(),c=$('country').value,t=$('type').value;return data.filter(x=>(!q||(`${x.name} ${x.city}`).toLowerCase().includes(q))&&(!c||x.country===c)&&(!t||x.type===t))}
function countries(){let old=$('country').value;let vals=[...new Set(data.map(x=>x.country))].sort();$('country').innerHTML='<option value="">Wszystkie kraje</option>'+vals.map(x=>`<option>${x}</option>`).join('');$('country').value=old}
function render(){countries();let arr=filtered();$('count').textContent=`${arr.length} ${arr.length===1?'obiekt':'obiektów'} w widoku`;$('cards').innerHTML=arr.map(x=>`<article class="card" onclick="openDetail('${x.id}')"><div class="city">${x.city} · ${x.country}</div><h3>${x.name}</h3><p>${x.type}${x.year?' · od '+x.year:''}</p></article>`).join('');layer.clearLayers();arr.forEach(x=>{L.marker([x.lat,x.lng]).addTo(layer).bindPopup(`<div class="popup-title">${x.name}</div>${x.city}, ${x.country}<br><button onclick="openDetail('${x.id}')" style="margin-top:7px">Zobacz profil</button>`)})}
window.openDetail=id=>{let x=data.find(y=>y.id===id);if(!x)return;$('detail').innerHTML=`<div class="eyebrow">${x.city} · ${x.country}</div><h2>${x.name}</h2><div class="tags">${(x.functions||[]).map(f=>`<span class="tag">${f}</span>`).join('')}</div><div class="meta"><div><b>Typ</b>${x.type||'—'}</div><div><b>Rok otwarcia</b>${x.year||'—'}</div><div><b>Powierzchnia</b>${x.area?x.area+' m²':'—'}</div><div><b>WAPI</b>${x.wapi||'—'}</div><div><b>Adres</b>${x.address||'—'}</div><div><b>Operator</b>${x.operator||'—'}</div></div><p class="description">${x.description||'Brak opisu.'}</p>${x.source?`<p><a href="${x.source}" target="_blank" rel="noopener">Źródło / strona centrum ↗</a></p>`:''}<button class="btn" onclick="editCentre('${x.id}')">Edytuj dane</button>`;$('drawer').classList.add('open');map.flyTo([x.lat,x.lng],Math.max(map.getZoom(),9))}
function openForm(x={}){$('editId').value=x.id||'';$('name').value=x.name||'';$('fType').value=x.type||'CIC';$('city').value=x.city||'';$('fCountry').value=x.country||'';$('lat').value=x.lat||'';$('lng').value=x.lng||'';$('address').value=x.address||'';$('year').value=x.year||'';$('area').value=x.area||'';$('operator').value=x.operator||'';$('functions').value=(x.functions||[]).join(', ');$('description').value=x.description||'';$('wapi').value=x.wapi||'';$('source').value=x.source||'';$('modal').classList.add('open')}
window.editCentre=id=>openForm(data.find(x=>x.id===id)||{});$('addBtn').onclick=()=>openForm();['modalClose','cancel'].forEach(id=>$(id).onclick=()=>$('modal').classList.remove('open'));$('drawerClose').onclick=()=>$('drawer').classList.remove('open');['search','country','type'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('form').onsubmit=e=>{e.preventDefault();let id=$('editId').value||('c'+Date.now());let x={id,name:$('name').value.trim(),type:$('fType').value,city:$('city').value.trim(),country:$('fCountry').value.trim(),lat:+$('lat').value,lng:+$('lng').value,address:$('address').value.trim(),year:$('year').value,area:$('area').value,operator:$('operator').value.trim(),functions:$('functions').value.split(',').map(s=>s.trim()).filter(Boolean),description:$('description').value.trim(),wapi:$('wapi').value,source:$('source').value.trim()};let i=data.findIndex(y=>y.id===id);i>=0?data[i]=x:data.push(x);save();$('modal').classList.remove('open');render();openDetail(id)};
$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='centra-integracji.json';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
